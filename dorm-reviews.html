<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorm Reviews</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/chrome.css">
<link rel="stylesheet" href="assets/css/reviews.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-left">
      <div class="logo" onclick="location.href='index.html'">Planet<span>Dorm</span></div>
      <button class="nav-search-btn nav-search-btn-desktop" id="navSearchBtnDesktop" aria-label="Search halls" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>
    <div class="nav-links" id="navLinks">
      <button class="active" onclick="location.href='index.html'">On-campus</button>
      <button onclick="location.href='index.html#map'">Map</button>
      <button onclick="location.href='my-dorms.html'">My Dorms</button>
      <button onclick="location.href='about.html'">About</button>
      <button class="nav-theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="label-light">Light mode</span>
        <span class="label-dark">Dark mode</span>
      </button>
    </div>
    <div class="nav-right">
      <div class="nav-search" id="navSearch">
        <input type="text" id="dormSearch" placeholder="Search halls..." autocomplete="off" aria-label="Search halls" tabindex="-1">
        <button class="nav-search-btn" id="navSearchBtn" aria-label="Search halls" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <div class="td-search-menu" id="dormSearchMenu" hidden></div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" onclick="document.body.classList.toggle('nav-open', document.getElementById('navLinks').classList.toggle('open'));this.classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <div class="nav-search-bar" id="navSearchBar" hidden>
    <div class="nav-search-bar-inner" id="navSearchBarSlot"></div>
  </div>
</nav>

<div class="td-page">

  <div class="td-gallery" id="gallery"></div>

  <div class="td-header" id="dormHeader"></div>

  <div class="td-body">
    <div class="td-filters" id="filterRow"></div>
    <div class="td-reviews">
      <div class="td-card" id="reviewForm" hidden>
        <div class="td-form-title">Write a review</div>
        <label class="td-label" for="formName">Your name</label>
        <input type="text" id="formName" class="td-input" placeholder="Anonymous Terp" maxlength="100">
        <div class="td-label">Rating</div>
        <div class="td-star-picker" id="formStars"></div>
        <div class="td-label">Year lived there</div>
        <div class="td-years" id="formYears"></div>
        <label class="td-label" for="formText">Your review</label>
        <textarea id="formText" class="td-textarea" maxlength="2000" placeholder="What was your experience like?"></textarea>
        <span class="td-char" id="charCount">0 / 2000</span>
        <div id="formCaptcha" style="margin:14px 0 18px"></div>
        <div class="td-form-btns">
          <button class="td-cancel" id="formCancel">Cancel</button>
          <button class="td-submit" id="formSubmit">Submit review</button>
        </div>
      </div>
      <div id="reviewsLoading" class="reviews-loading visible"><img src="assets/img/logo-animated.svg" class="reviews-loading-icon" alt=""></div>
      <div id="reviewsList" class="td-reviews" style="padding:0"></div>
      <button class="td-show-all" id="showAllBtn" hidden></button>
    </div>

    <div class="td-sidebar">
      <div class="td-card" id="breakdownCard" hidden></div>
      <div class="td-card" id="mapCard" hidden>
        <div class="td-card-title">Location</div>
        <div class="td-map-frame" id="mapPreview" onclick="location.href='index.html#map'" role="link" aria-label="Open the campus map" title="Open the campus map"></div>
        <div class="td-walks" id="walkTimes" hidden></div>
      </div>
      <div class="td-card" id="glanceCard" hidden></div>
      <button class="td-write-btn" id="writeReviewLink">Write a review</button>
    </div>
  </div>

</div>

<div class="td-toast" id="toast"></div>

<div class="td-lightbox" id="lightbox">
  <button class="td-lightbox-close" id="lightboxClose" aria-label="Close photo viewer">&times;</button>
  <div class="td-lightbox-inner">
    <img id="lightboxImg" src="" alt="">
    <div class="td-lightbox-strip" id="lightboxStrip"></div>
  </div>
</div>

<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<script type="module" src="assets/js/reviews.js"></script>

</body>
</html>
