<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dorms – PlanetDorm</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
// v2 theme model: light is the default; dark is opt-in via data-theme="dark".
(function(){
  var saved = localStorage.getItem('pd2-theme');
  var dark = saved ? saved === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) document.documentElement.dataset.theme = 'dark';
})();
function toggleTheme(){
  var root = document.documentElement;
  var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  if (next === 'dark') root.dataset.theme = 'dark';
  else delete root.dataset.theme;
  localStorage.setItem('pd2-theme', next);
}
</script>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  /* Matches the index hero: same padding, type scale, and hairline border. */
  .saved-hero {
    padding: 88px 48px 48px;
    border-bottom: 1px solid var(--line);
  }

  .saved-hero h1 {
    font-weight: 800;
    font-size: clamp(2.2rem, 4vw, 3.4rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
  }

  .saved-hero h1 .dot { color: var(--red); }

  .saved-hero p {
    color: var(--dim);
    font-size: 1.02rem;
    margin: 0;
    max-width: 40em;
  }

  .saved-body { padding: 0 48px 64px; }

  .saved-note {
    text-align: right;
    font-size: 0.75rem;
    color: var(--dim);
    margin: 0;
    padding: 16px 8px 0;
  }

  .saved-empty {
    padding: 72px 8px;
    text-align: center;
    color: var(--dim);
  }

  .saved-empty h2 { color: var(--ink); font-weight: 800; margin-bottom: 10px; }
  .saved-empty p { margin-bottom: 24px; }

  .saved-empty .browse-link {
    display: inline-block;
    background: var(--red);
    color: #fff;
    border-radius: 8px;
    padding: 10px 22px;
    font-weight: 700;
    font-size: 0.9rem;
    transition: background 0.15s;
  }
  .saved-empty .browse-link:hover { background: var(--red-dark); }

  @media (max-width: 768px) {
    .saved-hero { padding: 56px 20px 36px; }
    .saved-body { padding: 0 20px 48px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo" onclick="location.href='index.html'">Planet<span>Dorm</span></div>
    <div class="nav-links" id="navLinks">
      <button onclick="location.href='index.html'" data-section="home">On-campus</button>
      <button onclick="location.href='index.html#map'" data-section="map">Map</button>
      <button class="active" onclick="location.href='my-dorms.html'">My Dorms</button>
      <button onclick="location.href='about.html'">About</button>
      <button class="nav-theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="label-light">Light mode</span>
        <span class="label-dark">Dark mode</span>
      </button>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" onclick="document.getElementById('navLinks').classList.toggle('open');this.classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="saved-hero">
  <h1>My Dorms<span class="dot">.</span></h1>
  <p id="savedCount">The halls you save show up here — they're stored on this device.</p>
</div>

<div class="saved-body">
  <div class="dorm-list" id="savedGrid"></div>
  <p class="saved-note">Note: Dorms are saved locally</p>
</div>

<p class="site-disclaimer">This website is not affiliated with the University of Maryland.</p>

<script type="module">
import { dorms } from './assets/js/data.js';
import { supabase } from './assets/js/supabase.js';

const SAVED_KEY = 'pd-saved';
let savedDorms = new Set();
try { savedDorms = new Set(JSON.parse(localStorage.getItem(SAVED_KEY)) || []); } catch { /* corrupt entry — start clean */ }

const HEART_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function areaLabel(area) {
  if (area === 'north') return 'North Campus';
  if (area === 'south') return 'South Campus';
  if (area === 'commons') return 'The Commons';
  return area;
}

function reviewWord(n) { return `${n} ${n === 1 ? 'review' : 'reviews'}`; }

// Tier by rounded rating: ≤2 red, 3 orange, 4 gold, 5 platinum.
function tierClass(rating) {
  const n = Math.round(rating);
  if (n <= 2) return 'rating-red';
  if (n === 3) return 'rating-orange';
  if (n === 4) return 'rating-gold';
  return 'rating-plat';
}

// Same row markup as the index directory (styles from styles.css).
function dormRowHTML(d) {
  const none = d.reviews === 0;
  const tagStr = d.tags.map(t => t.t).join(' · ');
  const meta = `${d.type} · ${areaLabel(d.area)}${tagStr ? ' · ' + tagStr : ''}`;
  const ratingHtml = none
    ? '<span class="rating-dim">—</span>'
    : `<span class="${tierClass(d.rating)}">${d.rating.toFixed(1)} ★</span>`;
  const cnt = none ? 'No reviews' : reviewWord(d.reviews);
  return `
    <div class="dorm-row" data-id="${d.id}">
      <div class="thumb" style="${d.imgs[0] ? `background-image:url('${d.imgs[0]}')` : ''}"></div>
      <div class="row-body">
        <h3>${escHtml(d.name)}</h3>
        <div class="row-meta">${escHtml(meta)}</div>
      </div>
      <div class="row-rating">
        <div class="num">${ratingHtml}</div>
        <div class="cnt">${cnt}</div>
      </div>
      <button class="save-btn saved" data-id="${d.id}" aria-label="Remove from saved" aria-pressed="true">${HEART_SVG}</button>
    </div>`;
}

function render() {
  const saved = dorms.filter(d => savedDorms.has(d.id));
  const grid = document.getElementById('savedGrid');
  const count = document.getElementById('savedCount');
  if (!saved.length) {
    count.textContent = 'Tap the heart on any dorm to keep it here for later.';
    grid.innerHTML = `
      <div class="saved-empty">
        <h2>No saved dorms yet</h2>
        <p>Note: Dorms are stored locally on your device.</p>
        <a class="browse-link" href="index.html">Browse halls</a>
      </div>`;
    return;
  }
  count.textContent = `${saved.length} saved hall${saved.length === 1 ? '' : 's'}.`;
  grid.innerHTML = saved.map(dormRowHTML).join('');

  grid.querySelectorAll('.dorm-row').forEach(row => {
    row.addEventListener('click', () => {
      location.href = `dorm-reviews.html?dorm=${encodeURIComponent(row.dataset.id)}`;
    });
  });
  grid.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      savedDorms.delete(btn.dataset.id);
      localStorage.setItem(SAVED_KEY, JSON.stringify([...savedDorms]));
      render();
    });
  });
}

// Live ratings, same source as the index directory. The list renders
// immediately; ratings fill in when (if) the query settles.
async function loadRatings() {
  try {
    const query = supabase.from('reviews').select('dormId, rating');
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
    const { data, error } = await Promise.race([query, timeout]);
    if (error || !data) return;
    const byDorm = {};
    data.forEach(r => (byDorm[r.dormId] = byDorm[r.dormId] || []).push(r.rating));
    dorms.forEach(d => {
      const list = byDorm[d.id] || [];
      d.reviews = list.length;
      d.rating = list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0;
    });
    render();
  } catch { /* offline / paused DB — rows just show "No reviews" */ }
}

render();
loadRatings();
</script>

</body>
</html>
