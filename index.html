<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanetDorm</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
// v2 theme model: light is the default (no attribute); dark is opt-in via
// data-theme="dark". Persisted in localStorage under "pd2-theme".
(function(){
  var saved = localStorage.getItem('pd2-theme');
  var dark = saved ? saved === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) document.documentElement.dataset.theme = 'dark';
})();
function toggleTheme(){
  var root = document.documentElement;
  var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  if (next === 'dark') root.dataset.theme = 'dark';
  else delete root.dataset.theme;
  localStorage.setItem('pd2-theme', next);
  if (window.refreshMapTheme) window.refreshMapTheme();
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="logo" onclick="showSection('home')">Planet<span>Dorm</span></div>
    <div class="nav-links" id="navLinks">
      <button class="active" onclick="showSection('home');closeNav()" data-section="home">On-campus</button>
      <button onclick="showSection('map');closeNav()" data-section="map">Map</button>
      <button onclick="location.href='my-dorms.html'">My Dorms</button>
      <button onclick="location.href='about.html'">About</button>
      <button class="nav-theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span class="label-light">Light mode</span>
        <span class="label-dark">Dark mode</span>
      </button>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" onclick="document.getElementById('navLinks').classList.toggle('open');this.classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="hero" id="heroSection">
  <div class="hero-main">
    <h1>Welcome to PlanetDorm</h1>
    <p>Honest reviews of every University of Maryland residence hall, written by the Terps who lived there.</p>
    <input type="text" id="searchInput" class="hero-search" placeholder="Search halls..." oninput="filterDorms()">
  </div>
</div>

<div class="section active" id="section-home">
  <div class="count-sort-row">
    <div class="filter-row-left">
      <button class="filter-toggle" id="filterToggle" onclick="document.getElementById('filterBand').classList.toggle('open');this.classList.toggle('open')">
        Filter by...
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="count-label" id="countEcho"></span>
    </div>
    <div class="sort-row">
      <span class="sort-tag">Sort</span>
      <button class="sort-opt active" data-sort="default" onclick="selectSort('default')">Default</button>
      <button class="sort-opt" data-sort="rating-desc" onclick="selectSort('rating-desc')">Highest rated</button>
      <button class="sort-opt" data-sort="rating-asc" onclick="selectSort('rating-asc')">Lowest rated</button>
      <select class="sort-select" id="sortSelect" aria-label="Sort halls" onchange="selectSort(this.value)">
        <option value="default">Default</option>
        <option value="rating-desc">Highest rated</option>
        <option value="rating-asc">Lowest rated</option>
      </select>
    </div>
  </div>

  <div class="filter-band" id="filterBand">
    <div class="filter-band-body">
      <div class="filter-band-inner">
        <div class="filter-line">
          <span class="filter-label">Campus</span>
          <div class="chip-group">
            <button class="chip" data-group="campus" data-value="north" onclick="toggleChip(this)">North Campus</button>
            <button class="chip" data-group="campus" data-value="south" onclick="toggleChip(this)">South Campus</button>
            <button class="chip" data-group="campus" data-value="commons" onclick="toggleChip(this)">The Commons</button>
          </div>
        </div>
        <div class="filter-line">
          <span class="filter-label">Rooms</span>
          <div class="chip-group">
            <button class="chip" data-group="room" data-value="traditional" onclick="toggleChip(this)">Traditional</button>
            <button class="chip" data-group="room" data-value="semi-suite" onclick="toggleChip(this)">Semi-Suite</button>
            <button class="chip" data-group="room" data-value="suite" onclick="toggleChip(this)">Suite</button>
            <button class="chip" data-group="room" data-value="apartment" onclick="toggleChip(this)">Apartment</button>
          </div>
        </div>
        <div class="filter-line">
          <span class="filter-label">Bathrooms</span>
          <div class="chip-group">
            <button class="chip" data-group="bath" data-value="community" onclick="toggleChip(this)">Community</button>
            <button class="chip" data-group="bath" data-value="single" onclick="toggleChip(this)">Single all-gender</button>
          </div>
        </div>
        <div class="filter-line">
          <span class="filter-label">Saved</span>
          <div class="chip-group">
            <button class="chip" data-group="saved" data-value="only" onclick="toggleChip(this)">♥ Saved halls</button>
          </div>
        </div>
        <div class="filter-line">
          <span class="filter-label">Features</span>
          <div class="chip-group">
            <button class="chip" data-group="feature" data-value="ac" onclick="toggleChip(this)">A/C</button>
            <button class="chip" data-group="feature" data-value="laundry" onclick="toggleChip(this)">In-hall Laundry</button>
            <button class="chip" data-group="feature" data-value="llp" onclick="toggleChip(this)">Honors / LLP</button>
            <button class="clear-all" id="clearAllBtn" onclick="setAllFilter()" hidden>Clear all</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="reviewsLoading" class="reviews-loading"><img src="assets/img/logo-animated.svg" class="reviews-loading-icon" alt=""></div>
  <div class="dorm-list" id="dormGrid"></div>
</div>

<div class="section detail-view" id="section-detail">
  <div id="detailContent"></div>
</div>

<div class="section" id="section-map">
  <div class="map-split" id="mapSplit">
    <aside class="map-sidebar" id="mapSidebar">
      <div class="map-sheet-handle" id="mapSheetHandle"><span></span></div>
      <div class="map-sidebar-head">
        <h2>Choose a dorm</h2>
        <div class="map-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="mapSearchInput" placeholder="Search by name or type" oninput="filterMapSidebar()">
        </div>
        <div class="map-campus-filter" id="mapCampusFilter">
          <button class="active" data-campus="all" onclick="setMapCampusFilter('all',this)">All campus</button>
          <button data-campus="north" onclick="setMapCampusFilter('north',this)">North</button>
          <button data-campus="south" onclick="setMapCampusFilter('south',this)">South</button>
          <button data-campus="commons" onclick="setMapCampusFilter('commons',this)">Commons</button>
        </div>
        <p class="map-result-count" id="mapResultCount"></p>
      </div>
      <div class="map-sidebar-list" id="mapSidebarList"></div>
    </aside>
    <button class="map-sidebar-toggle" id="mapSidebarToggle" onclick="toggleMapSidebar()" aria-label="Toggle housing list">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="map-container">
      <div id="mapFrame"></div>
      <div class="map-directions" id="mapDirections" hidden>
        <div class="map-directions-head">
          <div class="map-directions-titles">
            <div class="map-directions-kicker">Walking from</div>
            <div class="map-directions-title" id="mapDirectionsTitle"></div>
          </div>
          <div class="map-directions-actions">
            <button class="map-directions-collapse" id="mapDirectionsCollapse" aria-label="Collapse walk times" aria-expanded="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <button class="map-directions-close" onclick="closeDirections()" aria-label="Close walk times">&times;</button>
          </div>
        </div>
        <div class="map-directions-list" id="mapDirectionsList"></div>
      </div>
    </div>
  </div>
</div>

<p id="siteDisclaimer" class="site-disclaimer">This website is not affiliated with the University of Maryland.</p>

<div id="toast" class="toast"></div>

<!-- Invisible hCaptcha host for the quick-post strip (rendered on demand). -->
<div id="quickCaptcha" style="position:fixed;width:0;height:0;overflow:hidden;left:0;bottom:0"></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<script type="module" src="assets/js/script.js"></script>

</body>
</html>
