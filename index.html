<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanetDorm</title>
<link rel="icon" type="image/png" href="umd logo.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
 
<nav>
  <div class="nav-inner">
    <div class="logo" onclick="showSection('home')">Planet<span style="color:#EAA000">Dorm</span></div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" onclick="document.getElementById('navLinks').classList.toggle('open');this.classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <button class="active" onclick="showSection('home');closeNav()" data-section="home">On-campus</button>
      <button onclick="showSection('map');closeNav()" data-section="map">Map</button>
      <button onclick="location.href='about.html'">About</button>
    </div>
  </div>
</nav>
<script>
function closeNav(){document.getElementById('navLinks').classList.remove('open');document.getElementById('navToggle').classList.remove('open');}
</script>

 


<div class="hero" id="heroSection">
  <h1>Find a residence hall</h1>
  <p>before you move in...</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search dorms..." oninput="filterDorms()">

  </div>
</div>
 
<div class="section active" id="section-home">
  <div class="filter-row">
    <div class="filter-bar" id="filterBar">
      <button class="active" onclick="setFilter('all',this)">All</button>
      <button onclick="setFilter('north',this)">North Campus</button>
      <button onclick="setFilter('south',this)">South Campus</button>
      <button onclick="setFilter('commons',this)">The Commons</button>
    </div>
    <select class="sort-select" id="sortSelect" onchange="setSort(this.value)">
      <option value="default">Sort: Default</option>
      <option value="rating-desc">Rating: High to Low</option>
      <option value="rating-asc">Rating: Low to High</option>
    </select>
  </div>
  <div class="dorm-grid" id="dormGrid"></div>
</div>

<div class="section" id="section-offcampus">
  <div class="filter-row">
    <div class="filter-bar" id="offCampusFilterBar">
      <button class="active" onclick="setOffCampusFilter('all',this)">All</button>
      <button onclick="setOffCampusFilter('colpark',this)">College Park</button>
      <button onclick="setOffCampusFilter('hyattsville',this)">Hyattsville</button>
      <button onclick="setOffCampusFilter('greenbelt',this)">Greenbelt</button>
      <button onclick="setOffCampusFilter('riverdale',this)">Riverdale Park</button>
    </div>
    <select class="sort-select" id="offCampusSortSelect" onchange="setSort(this.value)">
      <option value="default">Sort: Default</option>
      <option value="rating-desc">Rating: High to Low</option>
      <option value="rating-asc">Rating: Low to High</option>
    </select>
  </div>
  <div class="dorm-grid" id="offCampusDormGrid"></div>
</div>
 
<div class="section detail-view" id="section-detail">
  <button class="detail-back" onclick="backToList()">&#8592; Back to all dorms</button>
  <div id="detailContent"></div>
  <div id="inlineReviewForm" class="review-form" style="display:none">
    <h3>Write a Review</h3>
    <div class="modal-row">
      <div>
        <label>Your Name</label>
        <input type="text" id="reviewName" placeholder="Anonymous Terp" maxlength="100">
      </div>
      <div>
        <label>Rating</label>
        <div class="star-input" id="starInput">
          <span onclick="setRating(1)">&#9733;</span>
          <span onclick="setRating(2)">&#9733;</span>
          <span onclick="setRating(3)">&#9733;</span>
          <span onclick="setRating(4)">&#9733;</span>
          <span onclick="setRating(5)">&#9733;</span>
        </div>
      </div>
    </div>
    <label>Year Lived There</label>
    <div id="yearPicker" class="year-picker"></div>
    <label>Your Review</label>
    <div class="textarea-wrap">
      <textarea id="reviewText" placeholder="What was your experience like?" maxlength="2000"></textarea>
      <span class="char-count" id="charCount">0 / 2000</span>
    </div>
    <div class="captcha-wrap">
      <div class="h-captcha" data-sitekey="48ce88c8-9f00-47ee-a3f6-900c5abe7686" data-theme="dark"></div>
    </div>
    <div class="btn-row">
      <button class="cancel-btn" onclick="closeInlineForm()">Cancel</button>
      <button class="submit-btn" onclick="submitReview()">Submit Review</button>
    </div>
  </div>
</div>
 
<div class="section" id="section-map">
  <div class="map-container">
    <div id="mapFrame"></div>
  </div>
</div>
 

 
<div id="toast" class="toast"></div>

<div id="maintenanceOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:#0d1117;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;">
  <img src="umd logo.png" alt="PlanetDorm" style="width:80px;margin-bottom:1.5rem;opacity:0.85;">
  <h1 style="color:#EAA000;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:0.75rem;">We'll be right back</h1>
  <p style="color:#ccc;font-size:1.1rem;max-width:400px;">The server is temporarily down. We will be back up soon!</p>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-nav prev" onclick="event.stopPropagation();navLightbox(-1)">&#8249;</button>
  <img id="lightboxImg" src="">
  <button class="lightbox-nav next" onclick="event.stopPropagation();navLightbox(1)">&#8250;</button>
</div>
 
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<script type="module" src="script.js"></script>

</body>
</html>
