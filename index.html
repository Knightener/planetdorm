<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanetDorm</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="logo" onclick="showSection('home')">Planet<span style="color:#ffd200">Dorm</span></div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" onclick="document.getElementById('navLinks').classList.toggle('open');this.classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <button class="active" onclick="showSection('home');closeNav()" data-section="home">On-campus</button>
      <button onclick="showSection('map');closeNav()" data-section="map">Map</button>
      <button onclick="location.href='about.html'">About</button>
    </div>
  </div>
</nav>

<div class="hero" id="heroSection">
  <h1>Find a residence hall</h1>
  <p>before you move in...</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search dorms..." oninput="filterDorms()">

  </div>
</div>

<div class="section active" id="section-home">
  <div class="filter-row">
    <div class="filter-bar" id="filterBar">
      <div class="filter-dropdown" id="campusDropdown">
        <button class="filter-dropdown-btn" id="campusDropdownBtn" onclick="toggleCampusDropdown()">Filter</button>
        <div class="filter-dropdown-panel" id="campusDropdownPanel">
          <button class="dropdown-all-btn active" id="dropdownAllBtn" onclick="setAllFilter()">All residences</button>
          <div class="dropdown-sections">
            <div class="dropdown-col">
              <p class="dropdown-section-label">Campus</p>
              <label class="dropdown-check-item"><input type="checkbox" value="north" onchange="toggleCampusFilter(this)"> North Campus</label>
              <label class="dropdown-check-item"><input type="checkbox" value="south" onchange="toggleCampusFilter(this)"> South Campus</label>
              <label class="dropdown-check-item"><input type="checkbox" value="commons" onchange="toggleCampusFilter(this)"> The Commons</label>
            </div>
            <div class="dropdown-col">
              <p class="dropdown-section-label">Room Type</p>
              <label class="dropdown-check-item"><input type="checkbox" value="traditional" onchange="toggleRoomTypeFilter(this)"> Traditional</label>
              <label class="dropdown-check-item"><input type="checkbox" value="semi-suite" onchange="toggleRoomTypeFilter(this)"> Semi-Suite</label>
              <label class="dropdown-check-item"><input type="checkbox" value="suite" onchange="toggleRoomTypeFilter(this)"> Suite</label>
              <label class="dropdown-check-item"><input type="checkbox" value="apartment" onchange="toggleRoomTypeFilter(this)"> Apartment</label>
            </div>
            <div class="dropdown-col">
              <p class="dropdown-section-label">Features</p>
              <label class="dropdown-check-item"><input type="checkbox" value="ac" onchange="toggleFeatureFilter(this)"> A/C</label>
              <label class="dropdown-check-item"><input type="checkbox" value="laundry" onchange="toggleFeatureFilter(this)"> In-hall Laundry</label>
              <label class="dropdown-check-item"><input type="checkbox" value="llp" onchange="toggleFeatureFilter(this)"> Honors / LLP</label>
            </div>
          </div>
        </div>
      </div>
    </div>
    <select class="sort-select" id="sortSelect" onchange="setSort(this.value,'on')">
      <option value="default">Sort: Default</option>
      <option value="rating-desc">Rating: High to Low</option>
      <option value="rating-asc">Rating: Low to High</option>
    </select>
  </div>
  <div id="reviewsLoading" class="reviews-loading"><img src="logo-animated.svg" class="reviews-loading-icon" alt=""></div>
  <div class="dorm-grid" id="dormGrid"></div>
</div>

<div class="section" id="section-offcampus">
  <div class="filter-row">
    <div class="filter-bar" id="offCampusFilterBar">
      <button class="active" onclick="setOffCampusFilter('all',this)">All</button>
      <button onclick="setOffCampusFilter('colpark',this)">College Park</button>
      <button onclick="setOffCampusFilter('hyattsville',this)">Hyattsville</button>
      <button onclick="setOffCampusFilter('greenbelt',this)">Greenbelt</button>
      <button onclick="setOffCampusFilter('riverdale',this)">Riverdale Park</button>
    </div>
    <select class="sort-select" id="offCampusSortSelect" onchange="setSort(this.value,'off')">
      <option value="default">Sort: Default</option>
      <option value="rating-desc">Rating: High to Low</option>
      <option value="rating-asc">Rating: Low to High</option>
    </select>
  </div>
  <div class="dorm-grid" id="offCampusDormGrid"></div>
</div>

<div class="section detail-view" id="section-detail">
  <div id="detailContent"></div>
  <div id="inlineReviewForm" class="review-form" style="display:none">
    <h3>Write a Review</h3>
    <div class="modal-row">
      <div>
        <label for="reviewName">Your Name</label>
        <input type="text" id="reviewName" placeholder="Anonymous Terp" maxlength="100">
      </div>
      <div>
        <p class="review-form-label">Rating</p>
        <div class="star-input" id="starInput" role="group" aria-label="Star rating">
          <span onclick="setRating(1)">&#9733;</span>
          <span onclick="setRating(2)">&#9733;</span>
          <span onclick="setRating(3)">&#9733;</span>
          <span onclick="setRating(4)">&#9733;</span>
          <span onclick="setRating(5)">&#9733;</span>
        </div>
      </div>
    </div>
    <p class="review-form-label">Year Lived There</p>
    <div id="yearPicker" class="year-picker" role="group" aria-label="Year lived there"></div>
    <label for="reviewText">Your Review</label>
    <div class="textarea-wrap">
      <textarea id="reviewText" placeholder="What was your experience like?" maxlength="2000"></textarea>
      <span class="char-count" id="charCount">0 / 2000</span>
    </div>
    <div class="captcha-wrap">
      <div class="h-captcha" data-sitekey="48ce88c8-9f00-47ee-a3f6-900c5abe7686" data-theme="dark"></div>
    </div>
    <div class="btn-row">
      <button class="cancel-btn" onclick="closeInlineForm()">Cancel</button>
      <button class="submit-btn" onclick="submitReview()">Submit Review</button>
    </div>
  </div>
</div>

<div class="section" id="section-map">
  <div class="map-container">
    <div id="mapFrame"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="maintenanceOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:#0d1117;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2rem;">
  <img src="favicon.svg" alt="PlanetDorm" style="width:80px;margin-bottom:1.5rem;">
  <h1 style="color:#EAA000;font-family:'DM Serif Display',serif;margin-bottom:0.75rem;">We'll be right back...</h1>
  <p style="color:#ccc;font-size:1.1rem;max-width:400px;">Our review server is temporarily down. We will be back up soon!</p>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-nav prev" onclick="event.stopPropagation();navLightbox(-1)">&#8249;</button>
  <img id="lightboxImg" src="">
  <button class="lightbox-nav next" onclick="event.stopPropagation();navLightbox(1)">&#8250;</button>
</div>

<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<script type="module" src="script.js"></script>

</body>
</html>
